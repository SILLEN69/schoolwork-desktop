name: Finish verified release publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-release.yml]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run containing verified Windows release packages
        required: true
        default: '38065515364'
      tag:
        description: Existing release tag
        required: true
        default: v0.9.0
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-packages
          path: release
          run-id: ${{ inputs.build_run_id || '38065515364' }}
          github-token: ${{ github.token }}
      - name: Verify recovered installer and update metadata
        run: node scripts/verify-release.cjs release
      - name: Verify uploaded assets and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.9.0' }}
        run: node scripts/publish-release.mjs
