name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lesson-ui:
    name: Electron lesson verification (simulated services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron with checksum verification
        run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm test -- --maxWorkers=4
      - name: Exercise real Electron UI and IPC with synthetic audio
        run: xvfb-run -a node scripts/test-lessons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-verification
          path: work/lesson-verification/
          if-no-files-found: ignore

  windows-release:
    name: Build and publish Windows x64 packages
    needs: lesson-ui
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version.' }
      - run: npm ci
      - name: Install Electron with checksum verification
        run: node node_modules/electron/install.js
      - name: Build application and native Windows helper
        run: npm run build
      - name: Run unit tests including Windows-specific checks
        run: npm test -- --maxWorkers=4
      - name: Package installer and portable app without publishing
        run: node scripts/package-win.mjs
      - name: Verify update manifest and generate SHA-256 checksums
        run: |
          node scripts/verify-release.cjs release
          if ($LASTEXITCODE -ne 0) { throw 'Release integrity check failed.' }
          $version = node -p "require('./package.json').version"
          $names = @("SchoolWork-$version-x64-setup.exe", "SchoolWork-$version-x64-portable.exe", "SchoolWork-$version-x64-setup.exe.blockmap", 'latest.yml')
          $lines = foreach ($name in $names) { $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $name" }
          [System.IO.File]::WriteAllText((Join-Path $PWD "release/SHA256SUMS-v$version.txt"), ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-packages
          path: |
            release/*-setup.exe
            release/*-portable.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-*.txt
      - name: Upload all assets to a draft, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
