name: Diagnose Windows PowerShell execution
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-windows-process.mjs
      - .github/workflows/diagnose-windows.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/diagnose-windows-process.mjs
